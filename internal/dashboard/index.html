<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tickstore · live</title>
<style>
  :root {
    --bg: #0a0c11; --panel: #0f131b; --panel2: #0c0f16; --line: #1c2432;
    --line2: #141a25; --text: #cdd6e3; --dim: #8a93a3; --muted: #5c6575;
    --accent: #63a4ff; --buy: #26c281; --sell: #f0616d; --warn: #e0a53b;
    --buy-bg: rgba(38,194,129,.11); --sell-bg: rgba(240,97,109,.11);
    --best-bid: rgba(38,194,129,.15); --best-ask: rgba(240,97,109,.15);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    color: var(--text);
    font-family: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 12.5px; line-height: 1.4; font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 14px 18px; }

  header {
    display: flex; align-items: center; gap: 10px; height: 46px;
    border-bottom: 1px solid var(--line); margin-bottom: 12px;
  }
  .brand { font-size: 14px; font-weight: 600; letter-spacing: .3px; }
  .brand .k { color: var(--accent); }
  .brand .s { color: var(--muted); font-weight: 400; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--buy); flex: none; }
  .dot.down { background: var(--sell); }
  .clock { margin-left: auto; color: var(--dim); font-size: 12px; letter-spacing: .5px; }

  /* Metrics — flat, wraps on small screens */
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
    background: var(--line2); border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden; margin-bottom: 12px; }
  .metric { background: var(--panel); padding: 11px 15px; }
  .metric .k { color: var(--muted); font-size: 9.5px; text-transform: uppercase; letter-spacing: .9px; }
  .metric .v { font-size: 20px; font-weight: 600; margin-top: 5px; letter-spacing: -.3px; white-space: nowrap; }
  .metric .v small { font-size: 11px; color: var(--dim); font-weight: 400; letter-spacing: 0; }
  .metric.rate .v { color: var(--accent); }
  .metric .v.warn { color: var(--warn); }
  .metric .sub { color: var(--muted); font-size: 10px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Quotes + Order book row (equal bounded height); tape strip below */
  .top { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
    gap: 12px; height: clamp(340px, 50vh, 500px); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    display: flex; flex-direction: column; min-height: 0; }
  .ph { display: flex; align-items: center; gap: 8px; height: 33px; padding: 0 13px;
    border-bottom: 1px solid var(--line); flex: none; }
  .ph .t { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .ph .n { margin-left: auto; color: var(--muted); font-size: 10px; }
  .scroll { flex: 1; min-height: 0; overflow: auto; }

  /* Quotes */
  .qgroup { padding: 8px 13px 3px; display: flex; align-items: baseline; gap: 10px;
    border-top: 1px solid var(--line2); }
  .qgroup:first-child { border-top: 0; }
  .qgroup .pair { font-size: 12.5px; font-weight: 700; letter-spacing: .3px; }
  .qgroup .pair .q { color: var(--muted); font-weight: 500; }
  .qgroup .mid { margin-left: auto; color: var(--dim); font-size: 11px; }
  .qgroup .mid b { color: var(--text); font-weight: 600; }
  table.q { width: 100%; border-collapse: collapse; }
  table.q th { color: var(--muted); font-weight: 500; font-size: 9.5px; text-transform: uppercase;
    letter-spacing: .5px; text-align: right; padding: 2px 13px 3px 0; }
  table.q th:first-child { padding-left: 13px; text-align: left; }
  table.q td { padding: 3px 13px 3px 0; text-align: right; white-space: nowrap; }
  table.q td:first-child { padding-left: 13px; text-align: left; }
  table.q tr:hover td { background: var(--line2); }
  table.q .v { color: var(--accent); }
  table.q .num { color: var(--text); } table.q .sp { color: var(--dim); }
  table.q .bid { color: var(--buy); } table.q .ask { color: var(--sell); }
  table.q td.bbid { background: var(--best-bid); }
  table.q td.bask { background: var(--best-ask); }
  table.q .stale { color: var(--warn); }
  td.chg { animation: chg .45s ease; }
  @keyframes chg { from { background: rgba(99,164,255,.26); } to {} }
  @media (prefers-reduced-motion: reduce) { td.chg { animation: none; } .scroll { scroll-behavior: auto; } }

  /* Order book ladder */
  .sel { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 11px; border-bottom: 1px solid var(--line); flex: none; }
  .sel button { font: inherit; font-size: 10px; color: var(--dim); background: transparent;
    border: 1px solid var(--line); border-radius: 5px; padding: 3px 7px; cursor: pointer; }
  .sel button:hover { color: var(--text); border-color: var(--muted); }
  .sel button.on { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .lrow { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 1.5px 13px; z-index: 0; }
  .lrow .bar { position: absolute; top: 1px; bottom: 1px; right: 0; z-index: -1; border-radius: 1px; }
  .lrow.ask .bar { background: var(--sell-bg); } .lrow.bid .bar { background: var(--buy-bg); }
  .lrow .px { text-align: left; font-weight: 500; }
  .lrow.ask .px { color: var(--sell); } .lrow.bid .px { color: var(--buy); }
  .lrow .sz { text-align: right; color: var(--text); }
  .spreadrow { display: flex; justify-content: space-between; padding: 6px 13px; margin: 3px 0;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    background: var(--panel2); color: var(--muted); font-size: 11px; }
  .spreadrow b { color: var(--text); font-weight: 600; }

  /* Time & Sales — short strip */
  .tape { height: 200px; margin-top: 12px; }
  .trow { display: grid; grid-template-columns: 60px 72px 78px 40px 1fr auto; gap: 10px;
    padding: 1.5px 13px; white-space: nowrap; }
  .trow .t { color: var(--muted); } .trow .v { color: var(--accent); } .trow .sym { color: var(--dim); }
  .trow .side.buy { color: var(--buy); } .trow .side.sell { color: var(--sell); }
  .trow .sz { text-align: right; color: var(--dim); } .trow .px { text-align: right; font-weight: 500; }
  .trow.buy .px { color: var(--buy); } .trow.sell .px { color: var(--sell); }
  .trow.big { background: rgba(224,165,59,.09); }
  .trow.big .sz { color: var(--warn); font-weight: 600; }
  .empty { color: var(--muted); padding: 15px 13px; }

  /* Mobile */
  @media (max-width: 820px) {
    .metrics { grid-template-columns: repeat(2, 1fr); }
    .top { grid-template-columns: 1fr; height: auto; }
    .top .panel { height: 300px; }
    .tape { height: 220px; }
    .trow { grid-template-columns: 54px 66px 40px 1fr auto; }
    .trow .sym { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="dot" id="dot"></span>
    <span class="brand"><span class="k">tick</span>store<span class="s">/live</span></span>
    <span class="clock" id="clock">—</span>
  </header>

  <div class="metrics">
    <div class="metric"><div class="k">Rows stored</div><div class="v" id="totalRows">—</div><div class="sub">trades + book</div></div>
    <div class="metric"><div class="k">Storage</div><div class="v" id="bytes">—</div><div class="sub">compressed · 30-day TTL</div></div>
    <div class="metric rate"><div class="k">Insert rate</div><div class="v" id="rate">—<small> /s</small></div><div class="sub">all venues, live</div></div>
    <div class="metric"><div class="k">Gaps / resyncs</div><div class="v" id="gaps">—</div><div class="sub">book integrity</div></div>
  </div>

  <div class="top">
    <div class="panel">
      <div class="ph"><span class="t">Quotes</span><span class="n">best highlighted</span></div>
      <div class="scroll" id="quotes"><div class="empty">waiting for books…</div></div>
    </div>
    <div class="panel">
      <div class="ph"><span class="t">Order book</span><span class="n" id="obNote">—</span></div>
      <div class="sel" id="sel"></div>
      <div class="scroll" id="ladder"><div class="empty">select a market…</div></div>
    </div>
  </div>

  <div class="panel tape">
    <div class="ph"><span class="t">Time &amp; Sales</span><span class="n">large prints highlighted</span></div>
    <div class="scroll" id="tapeFeed"><div class="empty">waiting for trades…</div></div>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
let tapeCursor = 0, prevTotal = null, prevAt = null, selected = null;
const prevQ = {};
const BIG_NOTIONAL = 15000;

const nf2 = new Intl.NumberFormat("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtInt = n => Math.round(n).toLocaleString("en-US");
function fmtBytes(n){ if(!n) return "0 B"; const u=["B","KB","MB","GB","TB"]; let i=0,v=n; while(v>=1024&&i<u.length-1){v/=1024;i++;} return (v<10&&i>0?v.toFixed(1):Math.round(v))+" "+u[i]; }
function px(n){ if(!n) return "—"; return n>=1000 ? nf2.format(n) : n.toFixed(n>=1?2:4); }
function sz(n){ if(n===0) return "0"; return parseFloat(Number(n).toFixed(4)).toString(); }
function trim(s){ return String(s).replace(/(\.\d*?)0+$/,"$1").replace(/\.$/,""); }
const pad = n => String(n).padStart(2,"0");
function setLive(ok){ $("dot").classList.toggle("down", !ok); }

async function pollBook(){
  try {
    const quotes = ((await (await fetch("/api/book")).json()).quotes) || [];
    renderQuotes(quotes); renderSel(quotes);
    let g=0,r=0; for(const q of quotes){ g+=q.gaps; r+=q.resyncs; }
    const el=$("gaps"); el.textContent=fmtInt(g)+" / "+fmtInt(r); el.classList.toggle("warn", g>0);
    setLive(true);
  } catch(e){ setLive(false); }
}

function renderQuotes(quotes){
  if(!quotes.length) return;
  const groups = {};
  for(const q of quotes){ const k=q.base+"·"+q.quote; (groups[k] ||= {base:q.base, quote:q.quote, rows:[]}).rows.push(q); }
  let html = "";
  for(const k of Object.keys(groups).sort()){
    const g = groups[k];
    const bestBid = Math.max(0, ...g.rows.map(r=>r.bid||0));
    const asks = g.rows.map(r=>r.ask).filter(a=>a>0);
    const bestAsk = asks.length ? Math.min(...asks) : 0;
    const mids = g.rows.filter(r=>r.bid&&r.ask).map(r=>(r.bid+r.ask)/2);
    const mid = mids.length ? mids.reduce((a,b)=>a+b,0)/mids.length : 0;
    html += `<div class="qgroup"><span class="pair">${g.base} <span class="q">· ${g.quote}</span></span>`+
      `<span class="mid">mid <b>${px(mid)}</b></span></div>`+
      `<table class="q"><thead><tr><th>Venue</th><th>Bid</th><th>Ask</th><th>Spread</th><th>Last</th></tr></thead><tbody>`;
    for(const q of g.rows){
      const key=q.venue+"|"+q.symbol, pv=prevQ[key]||{};
      const bf = pv.bid!==undefined && pv.bid!==q.bid ? " chg":"";
      const af = pv.ask!==undefined && pv.ask!==q.ask ? " chg":"";
      prevQ[key]={bid:q.bid, ask:q.ask};
      const bb = g.rows.length>1 && q.bid && q.bid===bestBid ? " bbid":"";
      const ba = g.rows.length>1 && q.ask && q.ask===bestAsk ? " bask":"";
      const stale = (!q.synced || q.age_ms>4000) ? ' <span class="stale">●</span>':"";
      html += `<tr><td class="v">${q.venue}${stale}</td>`+
        `<td class="bid${bb}${bf}">${px(q.bid)}</td><td class="ask${ba}${af}">${px(q.ask)}</td>`+
        `<td class="sp">${q.spread?px(q.spread):"—"}</td><td class="num">${px(q.last)}</td></tr>`;
    }
    html += `</tbody></table>`;
  }
  $("quotes").innerHTML = html;
}

function renderSel(quotes){
  const host=$("sel");
  const sig = quotes.map(q=>q.venue+q.symbol).join(",");
  if(!selected && quotes.length) selected={venue:quotes[0].venue, symbol:quotes[0].symbol};
  if(host.dataset.sig!==sig){
    host.dataset.sig=sig;
    host.innerHTML = quotes.map(q=>`<button data-v="${q.venue}" data-s="${q.symbol}">${q.venue} ${q.symbol}</button>`).join("");
    for(const b of host.children) b.onclick=()=>{ selected={venue:b.dataset.v, symbol:b.dataset.s}; markSel(); pollDepth(); };
  }
  markSel();
}
function markSel(){ for(const b of $("sel").children) b.classList.toggle("on", selected && b.dataset.v===selected.venue && b.dataset.s===selected.symbol); }

async function pollDepth(){
  if(!selected) return;
  try { renderLadder(await (await fetch(`/api/depth?venue=${encodeURIComponent(selected.venue)}&symbol=${encodeURIComponent(selected.symbol)}`)).json()); } catch(e){}
}
function renderLadder(d){
  $("obNote").textContent = `${d.venue} ${d.symbol}`;
  const host=$("ladder");
  const asks=(d.asks||[]).slice(0,10), bids=(d.bids||[]).slice(0,10);
  if(!d.found || (!bids.length && !asks.length)){ host.innerHTML='<div class="empty">no book yet…</div>'; return; }
  const maxCum = Math.max(bids.at(-1)?.cum||0, asks.at(-1)?.cum||0, 1e-9);
  const bb=bids[0]?.price||0, ba=asks[0]?.price||0;
  const spread=(bb&&ba)?ba-bb:0, mid=(bb&&ba)?(bb+ba)/2:0;
  const row=(l,side)=>{ const w=Math.max(1.5,(l.cum/maxCum)*100);
    return `<div class="lrow ${side}"><span class="bar" style="width:${w}%"></span><span class="px">${px(l.price)}</span><span class="sz">${sz(l.size)}</span></div>`; };
  let h="";
  for(let i=asks.length-1;i>=0;i--) h+=row(asks[i],"ask");
  h += `<div class="spreadrow"><span>spread <b>${spread?px(spread):"—"}</b></span><span>mid <b>${mid?px(mid):"—"}</b></span></div>`;
  for(let i=0;i<bids.length;i++) h+=row(bids[i],"bid");
  host.innerHTML=h;
}

async function pollTape(){
  try {
    const trades=((await (await fetch(`/api/tape?ts=${tapeCursor}`)).json()).trades)||[];
    if(trades.length){ tapeCursor=trades.at(-1).ts_nanos; appendTape(trades); }
  } catch(e){}
}
function appendTape(trades){
  const feed=$("tapeFeed"); const empty=feed.querySelector(".empty"); if(empty) empty.remove();
  const near = feed.scrollHeight-feed.scrollTop-feed.clientHeight < 48;
  const frag=document.createDocumentFragment();
  for(const r of trades){
    const notional=parseFloat(r.price)*parseFloat(r.size);
    const div=document.createElement("div");
    div.className="trow "+r.side+(notional>=BIG_NOTIONAL?" big":"");
    div.innerHTML=`<span class="t">${r.time}</span><span class="v">${r.venue}</span><span class="sym">${r.symbol}</span>`+
      `<span class="side ${r.side}">${r.side}</span><span class="sz">${trim(r.size)}</span><span class="px">${trim(r.price)}</span>`;
    frag.appendChild(div);
  }
  feed.appendChild(frag);
  while(feed.childElementCount>250) feed.removeChild(feed.firstChild);
  if(near) feed.scrollTop=feed.scrollHeight;
}

async function pollStats(){
  try {
    const s=await (await fetch("/api/stats")).json();
    $("clock").textContent=s.server_time+" UTC";
    $("totalRows").textContent=fmtInt(s.total_rows);
    $("bytes").textContent=fmtBytes(s.total_bytes);
    const nowMs=Date.now();
    if(prevTotal!==null){ const dt=(nowMs-prevAt)/1000, rate=dt>0?Math.max(0,(s.total_rows-prevTotal)/dt):0;
      $("rate").innerHTML=fmtInt(rate)+'<small> /s</small>'; }
    prevTotal=s.total_rows; prevAt=nowMs; setLive(true);
  } catch(e){ setLive(false); }
}

pollStats(); pollBook(); pollTape(); pollDepth();
setInterval(pollBook, 700);
setInterval(pollDepth, 700);
setInterval(pollTape, 1000);
setInterval(pollStats, 2000);
</script>
</body>
</html>
