<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tickstore · live</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #11151f; --line: #1e2635; --text: #c9d3e0;
    --muted: #6b7688; --accent: #4da3ff; --buy: #2ec46b; --sell: #ff5c6c;
    --snap: #f0b429;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .5px; font-weight: 600; }
  header h1 .tick { color: var(--accent); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--sell); transition: background .3s; }
  .dot.live { background: var(--buy); box-shadow: 0 0 8px var(--buy); }
  .clock { margin-left: auto; color: var(--muted); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; padding: 16px 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
  .card .value { font-size: 24px; font-weight: 600; margin-top: 6px; }
  .card .value small { font-size: 13px; color: var(--muted); font-weight: 400; }
  .card .sub { color: var(--muted); font-size: 11px; margin-top: 4px; }

  .feeds { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 18px 18px; }
  @media (max-width: 820px) { .feeds { grid-template-columns: 1fr; } }
  .feed { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 340px; max-height: 62vh; }
  .feed .head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .feed .head .title { font-weight: 600; }
  .feed .head .rate { margin-left: auto; color: var(--muted); font-size: 11px; }
  .rows { overflow-y: auto; padding: 4px 0; flex: 1; scroll-behavior: smooth; }
  .row { display: grid; grid-template-columns: 62px 66px 88px 44px 1fr auto; gap: 8px; padding: 1px 14px; white-space: nowrap; }
  .row:hover { background: #161c28; }
  .row .t { color: var(--muted); }
  .row .v { color: var(--accent); }
  .row .sym { color: var(--text); }
  .row .side.buy { color: var(--buy); } .row .side.sell { color: var(--sell); }
  .row .sz { text-align: right; color: var(--text); }
  .row .px { text-align: right; }
  .row.buy .px { color: var(--buy); } .row.sell .px { color: var(--sell); }
  .row .snap { color: var(--snap); }
  .empty { color: var(--muted); padding: 20px 14px; }
</style>
</head>
<body>
  <header>
    <div class="dot" id="dot"></div>
    <h1><span class="tick">tick</span>store <span style="color:var(--muted);font-weight:400">· live</span></h1>
    <div class="clock" id="clock">—</div>
  </header>

  <section class="cards">
    <div class="card"><div class="label">Total rows</div><div class="value" id="totalRows">—</div><div class="sub" id="totalRowsSub"></div></div>
    <div class="card"><div class="label">Storage on disk</div><div class="value" id="totalBytes">—</div><div class="sub" id="totalBytesSub"></div></div>
    <div class="card"><div class="label">Insert rate</div><div class="value" id="rate">—<small> rows/s</small></div><div class="sub">trades + book, live</div></div>
    <div class="card"><div class="label">Trades</div><div class="value" id="tradesRows">—</div><div class="sub" id="tradesBytes"></div></div>
    <div class="card"><div class="label">Book updates</div><div class="value" id="bookRows">—</div><div class="sub" id="bookBytes"></div></div>
  </section>

  <section class="feeds">
    <div class="feed">
      <div class="head"><span class="title">Trades</span><span class="rate" id="tradesRate"></span></div>
      <div class="rows" id="tradesFeed"><div class="empty">waiting for trades…</div></div>
    </div>
    <div class="feed">
      <div class="head"><span class="title">Order book</span><span class="rate" id="bookRate"></span></div>
      <div class="rows" id="bookFeed"><div class="empty">waiting for book updates… (needs persist_books)</div></div>
    </div>
  </section>

<script>
const MAX_ROWS = 400;          // cap DOM rows per feed
const cursors = { ts: 0, bs: 0 };
let prevTotal = null, prevAt = null;
const seenRate = { trades: 0, book: 0 };

function fmtInt(n) { return n.toLocaleString('en-US'); }
function fmtBytes(n) {
  if (!n) return '0 B';
  const u = ['B','KB','MB','GB','TB']; let i = 0; let v = n;
  while (v >= 1024 && i < u.length-1) { v /= 1024; i++; }
  return v.toFixed(v < 10 && i > 0 ? 1 : 0) + ' ' + u[i];
}

function addRows(elId, rows, isBook, counter) {
  if (!rows.length) return;
  const feed = document.getElementById(elId);
  const empty = feed.querySelector('.empty');
  if (empty) empty.remove();
  const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60;
  const frag = document.createDocumentFragment();
  for (const r of rows) {
    const div = document.createElement('div');
    div.className = 'row ' + r.side;
    const snap = isBook && r.is_snapshot ? ' <span class="snap">snap</span>' : '';
    div.innerHTML =
      `<span class="t">${r.time}</span>` +
      `<span class="v">${r.venue}</span>` +
      `<span class="sym">${r.symbol}</span>` +
      `<span class="side ${r.side}">${r.side}</span>` +
      `<span class="sz">${r.size}</span>` +
      `<span class="px">${r.price}${snap}</span>`;
    frag.appendChild(div);
  }
  feed.appendChild(frag);
  while (feed.childElementCount > MAX_ROWS) feed.removeChild(feed.firstChild);
  if (nearBottom) feed.scrollTop = feed.scrollHeight;
  seenRate[counter] += rows.length;
}

async function pollFeed() {
  try {
    const res = await fetch(`/api/feed?ts=${cursors.ts}&bs=${cursors.bs}`);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const trades = data.trades || [], book = data.book || [];
    if (trades.length) cursors.ts = trades[trades.length-1].ts_nanos;
    if (book.length)   cursors.bs = book[book.length-1].ts_nanos;
    addRows('tradesFeed', trades, false, 'trades');
    addRows('bookFeed', book, true, 'book');
    setLive(true);
  } catch (e) { setLive(false); }
}

async function pollStats() {
  try {
    const res = await fetch('/api/stats');
    if (!res.ok) throw new Error(res.status);
    const s = await res.json();
    document.getElementById('clock').textContent = s.server_time + ' UTC';
    document.getElementById('totalRows').textContent = fmtInt(s.total_rows);
    document.getElementById('totalBytes').textContent = fmtBytes(s.total_bytes);
    for (const t of s.tables) {
      if (t.name === 'trades') {
        document.getElementById('tradesRows').textContent = fmtInt(t.rows);
        document.getElementById('tradesBytes').textContent = fmtBytes(t.bytes) + ' on disk';
      } else if (t.name === 'book_updates') {
        document.getElementById('bookRows').textContent = fmtInt(t.rows);
        document.getElementById('bookBytes').textContent = fmtBytes(t.bytes) + ' on disk';
      }
    }
    const now = Date.now();
    if (prevTotal !== null) {
      const dt = (now - prevAt) / 1000;
      const rate = dt > 0 ? Math.max(0, (s.total_rows - prevTotal) / dt) : 0;
      document.getElementById('rate').innerHTML = fmtInt(Math.round(rate)) + '<small> rows/s</small>';
    }
    prevTotal = s.total_rows; prevAt = now;
    setLive(true);
  } catch (e) { setLive(false); }
}

let liveTimer = null;
function setLive(ok) {
  const dot = document.getElementById('dot');
  if (ok) {
    dot.classList.add('live');
    clearTimeout(liveTimer);
    liveTimer = setTimeout(() => dot.classList.remove('live'), 5000);
  } else {
    dot.classList.remove('live');
  }
}

// Per-feed rows/sec shown in each header, refreshed every few seconds.
setInterval(() => {
  document.getElementById('tradesRate').textContent = (seenRate.trades/3).toFixed(1) + ' rows/s';
  document.getElementById('bookRate').textContent = (seenRate.book/3).toFixed(1) + ' rows/s';
  seenRate.trades = 0; seenRate.book = 0;
}, 3000);

pollStats(); pollFeed();
setInterval(pollStats, 2000);
setInterval(pollFeed, 1000);
</script>
</body>
</html>
