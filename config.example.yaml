# Example tickstore config. Run with: tickstore -config config.example.yaml
#
# Every listed venue streams concurrently into the same sink. Each venue uses
# its own symbol format (Coinbase BTC-USD, Kraken BTC/USD, OKX BTC-USDT).

clickhouse:
  addr: 127.0.0.1:9000 # empty -> print trades to stdout instead
  database: tickstore
  username: tickstore
  password: tickstore

sink:
  max_rows: 10000 # flush a batch at this many rows...
  max_delay: 250ms # ...or after this long, whichever comes first
  buffer: 20000 # in-flight channel capacity (backpressure bound)

# Optional: route persistence through a durable NATS JetStream log instead of
# inserting to ClickHouse directly. Ingest publishes to the stream; a consumer
# drains it into ClickHouse, acking only after the insert (durable across
# crashes). Off by default. The live dashboard views are unaffected.
queue:
  enabled: false
  url: nats://localhost:4222
  stream: TICKS

metrics:
  addr: ":9090" # Prometheus endpoint at /metrics; empty disables it

dashboard:
  addr: ":8080" # live web view (feed + storage stats); empty disables it

# Also stream each venue's full L2 order book into the book_updates table
# ("the firehose"). Far higher volume than trades, so it's off by default and
# has a 30-day TTL. Needs clickhouse.addr set.
persist_books: false

venues:
  - name: coinbase
    symbols: [BTC-USD, ETH-USD]
  - name: kraken
    symbols: [BTC/USD, ETH/USD]
  - name: okx
    symbols: [BTC-USDT, ETH-USDT]
