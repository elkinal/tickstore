# The full stack: ClickHouse plus the tickstore app streaming three venues.
#
#   docker compose up -d --build     # run everything
#   docker compose up -d clickhouse  # just the database (for local `go run`/tests)
#
# Credentials come from the environment (see .env.example), defaulting to dev
# values. Ports bind to 127.0.0.1 only, so nothing is exposed publicly on a VPS;
# reach them over an SSH tunnel or a reverse proxy you control.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000" # native protocol
      - "127.0.0.1:8123:8123" # http
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tickstore}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-tickstore}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-tickstore}
    volumes:
      - clickhouse-data:/var/lib/clickhouse # persist data across restarts
      - ./internal/sink/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      # Turn off ClickHouse's own telemetry logs (they grew to ~12 GB here).
      - ./clickhouse/config.d/disable-logs.xml:/etc/clickhouse-server/config.d/disable-logs.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  # Durable log between ingest and the ClickHouse sink (enable in config.yaml).
  # JetStream with file storage; memory-capped so it can never starve ClickHouse
  # on the shared box.
  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    mem_limit: 256m
    volumes:
      - nats-data:/data
    ports:
      - "127.0.0.1:4222:4222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  tickstore:
    build: .
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy # wait for the DB before connecting
      nats:
        condition: service_healthy
    environment:
      # Passed into the container so the config file's ${...} refs resolve.
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tickstore}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-tickstore}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-tickstore}
    volumes:
      - ./config.docker.yaml:/etc/tickstore/config.yaml:ro
    ports:
      - "127.0.0.1:9090:9090" # Prometheus /metrics (localhost only)
      - "127.0.0.1:8080:8080" # dashboard, also reachable via SSH tunnel

  # Optional public HTTPS front door for the dashboard. Off by default (only the
  # localhost bindings above run); enable it with `docker compose --profile
  # public up -d` after setting DASHBOARD_DOMAIN in .env. It is the only service
  # that faces the internet and proxies just the dashboard.
  caddy:
    image: caddy:2
    profiles: ["public"]
    restart: unless-stopped
    depends_on:
      - tickstore
    environment:
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # persist issued certificates across restarts
      - caddy-config:/config

volumes:
  clickhouse-data:
  nats-data:
  caddy-data:
  caddy-config:
