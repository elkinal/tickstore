# Config used by the tickstore container in docker-compose. Same as
# config.example.yaml, but ClickHouse is reached by its compose service name.

clickhouse:
  addr: clickhouse:9000
  database: ${CLICKHOUSE_DB}
  username: ${CLICKHOUSE_USER}
  password: ${CLICKHOUSE_PASSWORD} # injected from the environment (.env)

sink:
  max_rows: 10000
  max_delay: 250ms
  buffer: 20000

metrics:
  addr: ":9090"

dashboard:
  addr: ":8080"

# Stream full L2 order books to book_updates ("the firehose"). ~0.15-0.2 GB/day
# compressed for the six symbols below, bounded by the table's 30-day TTL.
persist_books: true

venues:
  - name: coinbase
    symbols: [BTC-USD, ETH-USD]
  - name: kraken
    symbols: [BTC/USD, ETH/USD]
  - name: okx
    symbols: [BTC-USDT, ETH-USDT]
